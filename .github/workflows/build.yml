name: Build

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ main, 'release/**' ]

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      BUILD_SENTRY_ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'github-testing' || 'github-production' }}

    strategy:
      matrix:
        include:
          - build-flavour: debug
            output-subdir: _CompDebug_x64
          - build-flavour: debugoptimized
            output-subdir: _CompDebugOptimized_x64
          - build-flavour: release
            output-subdir: _CompRelease_x64

    steps:
    - name: Setup variables
      uses: actions/github-script@v9
      with:
        script: core.exportVariable('GITHUB_SHA_SHORT', context.sha.substring(0, 7))

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup Meson
      run: pip install meson==1.1.0

    - name: Build
      shell: pwsh
      run: |
        Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope Process
        . .\build_common.ps1
        PerformBuild -BuildFlavour ${{matrix.build-flavour}} -BuildSubDir ${{matrix.output-subdir}} -Backend ninja -EnableTracy false -WithShim $true copy_output

    - name: Upload build logs
      if: ${{ always() }}
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: build-logs-${{github.run_number}}-${{env.GITHUB_SHA_SHORT}}-${{matrix.build-flavour}}
        path: |
          ${{matrix.output-subdir}}\meson-logs\meson-log.txt
          ${{matrix.output-subdir}}\update-deps.log
          update-deps.log
        if-no-files-found: ignore
        retention-days: 30

    - name: Copy readme
      run: copy artifacts_readme.txt _output

    - name: Build arm64ec
      shell: pwsh
      run: |
        Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope Process
        . .\build_common.ps1
        PerformBuild -BuildFlavour ${{matrix.build-flavour}} -BuildSubDir _Comp${{matrix.build-flavour}}_arm64ec -BuildArch arm64ec -Backend vs2022 -EnableTracy false -WithShim $true -ConfigureOnly $true
        meson compile -C _Comp${{matrix.build-flavour}}_arm64ec
        Copy-Item -Path _Comp${{matrix.build-flavour}}_arm64ec\src\d3d9\d3d9_a64ec.dll, _Comp${{matrix.build-flavour}}_arm64ec\src\d3d9\d3d9_a64ec.pdb -Destination _output

    - name: Upload x64 binaries
      uses: actions/upload-artifact@v7
      with:
        name: rtx-remix-for-x64-games-${{github.run_number}}-${{env.GITHUB_SHA_SHORT}}-${{matrix.build-flavour}}
        path: |
          _output\*.dll
          _output\*.exe
          _output\*.pdb
          _output\*.txt
          _output\usd\*

    - name: Build and move x64 DXVK
      shell: pwsh
      run: |
        Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope Process
        . .\build_common.ps1
        PerformBuild -BuildFlavour ${{matrix.build-flavour}} -BuildSubDir ${{matrix.output-subdir}}_trex -Backend ninja -EnableTracy false -InstallTags output
        Remove-Item _output\d3d9_x64.*, _output\d3d9_a64ec.*
        mkdir _output\.trex
        Move-Item -Path _output\*.dll -Destination _output\.trex\
        Move-Item -Path _output\*.exe -Destination _output\.trex\
        Move-Item -Path _output\*.pdb -Destination _output\.trex\
        Move-Item -Path _output\usd -Destination _output\.trex\usd

    - name: Build arm64
      shell: pwsh
      run: |
        Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope Process
        . .\build_common.ps1
        PerformBuild -BuildFlavour ${{matrix.build-flavour}} -BuildSubDir _Comp${{matrix.build-flavour}}_arm64 -BuildArch arm64 -Backend ninja -EnableTracy false -InstallTags output

    - name: Upload arm64 binaries
      uses: actions/upload-artifact@v7
      with:
        name: rtx-remix-for-arm64-games-${{github.run_number}}-${{env.GITHUB_SHA_SHORT}}-${{matrix.build-flavour}}
        path: |
          _output\*.dll
          _output\*.exe
          _output\*.pdb
          _output\*.txt
          _output\usd\*

    - name: Move arm64 DXVK
      shell: pwsh
      run: |
        mkdir _output\.trex_arm64
        Move-Item -Path _output\*.dll -Destination _output\.trex_arm64\
        Move-Item -Path _output\*.exe -Destination _output\.trex_arm64\
        Move-Item -Path _output\*.pdb -Destination _output\.trex_arm64\
        Move-Item -Path _output\usd -Destination _output\.trex_arm64\usd

    - name: Build Bridge
      shell: pwsh
      run: |
        Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope Process
        pushd bridge
        . .\build_bridge_${{matrix.build-flavour}}.bat
        . .\build_bridge_${{matrix.build-flavour}}.bat arm64
        popd

    - name: Copy Bridge
      shell: pwsh
      run: |
        Copy-Item -Recurse -Path bridge\_output\* -Destination _output\ -Force

    - name: Upload x86 binaries
      uses: actions/upload-artifact@v7
      with:
        name: rtx-remix-for-x86-games-${{github.run_number}}-${{env.GITHUB_SHA_SHORT}}-${{matrix.build-flavour}}
        include-hidden-files: true
        path: |
          _output\*.dll
          _output\*.exe
          _output\*.pdb
          _output\*.txt
          _output\.trex\*.dll
          _output\.trex\*.exe
          _output\.trex\*.pdb
          _output\.trex\usd\*
          _output\.trex_arm64\*.dll
          _output\.trex_arm64\*.exe
          _output\.trex_arm64\*.pdb
          _output\.trex_arm64\usd\*

  notify-slack-on-failure:
    runs-on: ubuntu-latest
    needs: build-windows
    if: ${{ failure() }}

    steps:
    - name: Notify Slack
      uses: slackapi/slack-github-action@v3
      with:
        webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
        webhook-type: incoming-webhook
        payload: |
          text: "<!here> Build workflow failed for ${{ github.repository }}"
          blocks:
            - type: section
              text:
                type: mrkdwn
                text: "<!here> :rotating-light-red: *Build workflow failed* for `${{ github.repository }}`"
            - type: section
              fields:
                - type: mrkdwn
                  text: "*Ref:*\n`${{ github.ref_name }}`"
                - type: mrkdwn
                  text: "*Commit:*\n`${{ github.sha }}`"
                - type: mrkdwn
                  text: "*Event:*\n`${{ github.event_name }}`"
            - type: actions
              elements:
                - type: button
                  text:
                    type: plain_text
                    text: View workflow run
                  url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
